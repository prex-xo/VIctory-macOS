# Compiles the run-time and test HLSL shaders of victory-gpu with Microsoft's FXC. Wine's
# HLSL compiler cannot build all of them, so the macOS port embeds this
# output through `cargo xtask embed-test-shaders`.
name: test shaders

on:
  workflow_dispatch:
  push:
    paths:
      - crates/victory-gpu/src/fxc.rs
      - crates/victory-gpu/src/compute.rs
      - crates/victory-gpu/src/memory.rs
      - .github/workflows/test-shaders.yml

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the tests that compile shaders
        shell: pwsh
        env:
          VICTORY_DUMP_TEST_SHADERS: ${{ github.workspace }}\out
          VICTORY_D3D12_WARP: "1"
        run: |
          # The runner has no GPU, so tests may fail after compiling; only
          # the compiled shaders matter here.
          cargo test -p victory-gpu --features diagnostics --lib -- bindless:: draw::tests:: memory::tests:: twin::tests:: --test-threads=1
          Get-ChildItem out
          if (-not (Get-ChildItem out -Filter *.bin)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: test-shaders
          path: out/
